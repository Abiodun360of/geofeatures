[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geofeatures"
version = "0.4.0"
description = "Zonal statistics and NDVI feature extraction for remote sensing ML pipelines"
authors = [{name = "Abiodun Emmanuel Ofobutu"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "geopandas",
    "rasterstats",
    "rasterio",
    "matplotlib",
]
license = "MIT"

[tool.setuptools.packages.find]
where = ["."]
